{% extends "admin/change_form.html" %}

{% block extrastyle %}
    {{ block.super }}
    <style>
        /* Target only the User form */
        .custom-user-form .form-row {
            border-bottom: 1px solid #e2e8f0 !important;
            padding: 16px 0 !important;
        }

        /* Styling the labels (Username, Password, etc.) */
        .custom-user-form label {
            font-size: 13px !important;
            color: #475569 !important;
            font-weight: 600 !important;
            text-transform: uppercase !important;
            letter-spacing: 0.5px !important;
            margin-bottom: 6px !important;
            display: block !important;
        }

        /* Styling the text inputs */
        .custom-user-form input[type="text"],
        .custom-user-form input[type="password"],
        .custom-user-form input[type="email"],
        .custom-user-form select,
        .custom-user-form textarea {
            width: 100% !important;
            max-width: 500px !important;
            padding: 12px 16px !important;
            border: 1px solid #cbd5e1 !important;
            border-radius: 8px !important;
            font-size: 14px !important;
            background: #f8fafc !important;
            color: #1e293b !important;
            transition: all 0.2s ease !important;
            box-sizing: border-box !important;
        }

        /* Focus effect for inputs */
        .custom-user-form input:focus,
        .custom-user-form select:focus,
        .custom-user-form textarea:focus {
            background: #ffffff !important;
            border-color: #10b981 !important;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15) !important;
            outline: none !important;
        }

        /* Styling the help texts */
        .custom-user-form .help {
            font-size: 12px !important;
            color: #64748b !important;
            margin-top: 6px !important;
            line-height: 1.5 !important;
            display: block !important;
            font-style: normal !important;
            max-width: 500px !important;
        }

        /* Styling the "Enabled / Disabled" Radio Buttons */
        .custom-user-form ul {
            list-style: none !important;
            padding-left: 0 !important;
            display: flex !important;
            gap: 24px !important;
            margin-top: 8px !important;
        }
        
        .custom-user-form ul li {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
        }

        .custom-user-form ul li label {
            margin-bottom: 0 !important;
            text-transform: none !important;
            font-weight: 500 !important;
            font-size: 14px !important;
            color: #1e293b !important;
            cursor: pointer !important;
        }
        
        .custom-user-form input[type="radio"] {
            width: 18px !important;
            height: 18px !important;
            accent-color: #10b981 !important;
            cursor: pointer !important;
            margin: 0 !important;
        }

        /* Styling the top intro text ("After you've created a user...") */
        .custom-user-form p {
            font-size: 13px !important;
            color: #475569 !important;
            margin-bottom: 24px !important;
            background: #eaf5ee !important;
            padding: 16px !important;
            border-radius: 8px !important;
            border-left: 4px solid #10b981 !important;
            line-height: 1.5 !important;
        }
    </style>
{% endblock %}

{% block form_top %}
    <!-- This script applies the CSS class to the form -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var form = document.querySelector('#user_form');
            if (form) {
                form.classList.add('custom-user-form');
            }
        });
    </script>
{% endblock %}
